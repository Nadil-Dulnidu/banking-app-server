<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trust Wave - Register</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link th:href="@{https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css}" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="register-container">
            <div class="register-header">
                <div class="logo">
                    <i class="fas fa-university"></i>
                    <h1>Trust Wave</h1>
                </div>
                <p>Create your account to get started</p>
            </div>
            
            <form class="register-form" id="registerForm" method="post" role="form" th:action="@{/auth/register}" th:object="${userDTO}" >
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user"></i>
                            <input type="text" id="firstName" name="firstName" th:field="*{firstName}" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user"></i>
                            <input type="text" id="lastName" name="lastName" th:field="*{lastName}" required>
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <i class="fas fa-at"></i>
                        <input type="text" id="username" name="username" th:field="*{username}" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" name="email" th:field="*{email}" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <div class="input-wrapper">
                        <i class="fas fa-phone"></i>
                        <input type="tel" id="phone" name="phone" th:field="*{phone}" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="address">Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-map-marker-alt"></i>
                        <textarea id="address" name="address" rows="3" th:field="*{address}" required></textarea>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" th:field="*{password}"  required>
                        <button type="button" class="toggle-password" onclick="togglePassword('password')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="password-strength">
                        <div class="strength-bar">
                            <div class="strength-fill" id="strengthFill"></div>
                        </div>
                        <span class="strength-text" id="strengthText">Password strength</span>
                    </div>
                </div>
                
                <div class="form-options">
                    <label class="checkbox-wrapper">
                        <input type="checkbox" id="termsAgreement" required>
                        <span class="checkmark"></span>
                        I agree to the <a href="#" class="terms-link">Terms and Conditions</a>
                    </label>
                </div>

                <div th:text="${errMessage}" style="color: #dc3545"></div>

                <input type="hidden" th:name="userRole" th:value="'CUSTOMER'">
                
                <button type="submit" class="btn btn-primary">
                    <span>Create Account</span>
                    <i class="fas fa-user-plus"></i>
                </button>
                
                <div class="login-link">
                    <p>Already have an account? <a th:href="@{/auth/loginForm}">Sign in here</a></p>
                </div>
            </form>
        </div>
        
        <div class="features-panel">
            <h3>Join Trust Wave Today</h3>
            <div class="feature-list">
                <div class="feature-item">
                    <i class="fas fa-gift"></i>
                    <span>Welcome Bonus</span>
                </div>
                <div class="feature-item">
                    <i class="fas fa-credit-card"></i>
                    <span>Free Debit Card</span>
                </div>
                <div class="feature-item">
                    <i class="fas fa-percentage"></i>
                    <span>Competitive Rates</span>
                </div>
                <div class="feature-item">
                    <i class="fas fa-headset"></i>
                    <span>Dedicated Support</span>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/js/auth.js"></script>
    <script src="/js/animations.js"></script>
</body>
</html>
